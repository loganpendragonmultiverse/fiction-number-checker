[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiction-number-checker"
version = "1.1.1"
description = "Extract numerical facts from fiction for human consistency review."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Logan Pendragon Multiverse" }]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.3,<2", "mypy>=1.15,<3", "pip-audit>=2.9,<3", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
fiction-number-checker = "fiction_number_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fiction_number_checker --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.setuptools.data-files]
"share/fiction-number-checker" = ["README.md", "DEVELOPMENT.md", "TESTING.md", "CHANGELOG.md"]
"share/fiction-number-checker/examples" = ["examples/review.txt"]
