name: Feature request
description: Propose a focused manuscript-review improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What numerical review workflow is not covered? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed behavior, description: Explain false-positive and manuscript-privacy implications. }
    validations: { required: true }
